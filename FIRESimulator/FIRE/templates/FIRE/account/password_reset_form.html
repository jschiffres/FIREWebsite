{% extends 'FIRE/base.html' %}
{% block title %}Reset password | FIRE Simulator{% endblock %}
{% block content %}
<div class="col-11 col-sm-8 col-md-6 col-lg-4 mx-auto mt-3">
    <h1 class="text-center m-5">Reset password</h1>
    <p>Enter the email address on your account and we'll send you a link to choose a new password.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="id_email" name="email" placeholder="Email" autocomplete="email" required>
            <label for="id_email">Email</label>
        </div>
        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-action-filled">Send reset link</button>
        </div>
    </form>
</div>
{% endblock %}
