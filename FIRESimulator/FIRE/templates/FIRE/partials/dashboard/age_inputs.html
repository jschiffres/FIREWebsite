<div class="row g-3 mb-3 align-items-end dash-ages">
    <div class="col-6 col-md-3">
        <div>
            <label class="dash-kpi-label" for="current_age">Current age</label>
            <input type="number" class="form-control age-input" id="current_age" name="current_age" min="1" max="100" value="{{ plan.current_age }}" required aria-describedby="age-error" hx-post="{% url 'runplan' plan.id %}" hx-target="#runplan-div" hx-swap="innerHTML" hx-trigger="change[validateAges()] delay:1s">
                    </div>
    </div>
    <div class="col-6 col-md-3">
        <div>
            <label class="dash-kpi-label" for="retirement_age">Retirement age</label>
            <input type="number" class="form-control dashboard-input-field age-input" id="retirement_age" name="retirement_age" min="2" max="101" value="{{ plan.retirement_age }}" required aria-describedby="age-error" hx-post="{% url 'runplan' plan.id %}" hx-target="#runplan-div" hx-swap="innerHTML" hx-trigger="change[validateAges()] delay:1s">
        </div>
    </div>
    <div class="col-12 col-md-6">
        <div id="age-error" class="text-danger small" role="alert" aria-live="polite"></div>
    </div>
</div>
<script>
    (function () {
        function value(id) {
            const raw = document.getElementById(id).value;
            return raw === '' ? null : Number(raw);
        }
        window.validateAges = function () {
            const current = value('current_age');
            const retirement = value('retirement_age');
            let message = '';
            let bad = [];
            if (current === null || current < 1) { message = 'Enter your current age.'; bad = ['current_age']; }
            else if (retirement === null || retirement <= current) { message = 'Retirement age must be greater than current age.'; bad = ['retirement_age']; }
            document.querySelectorAll('.age-input').forEach(el => {
                el.classList.toggle('is-invalid', bad.includes(el.id));
            });
            document.getElementById('age-error').textContent = message;
            return message === '';
        };
        document.querySelectorAll('.age-input').forEach(el => el.addEventListener('input', window.validateAges));
    })();
</script>
